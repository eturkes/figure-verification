# Gallery-only honest twins: each draws a blocked rule-corpus case's own data the honest way, so the
# gallery can show the pair side by side. Format = `tests/figure_corpus/integrity.toml`'s; every
# case must pass (`tests/test_gallery.py`). The rule corpus itself stays the acceptance set.

[[case]]
id = "overplotted-bars-side-by-side"
expect = "pass"
request = "Bars a 1 and b 2, then a 3 and b 4"
program = '''
import matplotlib.pyplot as plt
plt.bar([-0.2, 0.8], [1, 2], width=0.4, label="first")
plt.bar([0.2, 1.2], [3, 4], width=0.4, label="second")
plt.xticks([0, 1], ["a", "b"])
plt.legend()
'''

[[case]]
id = "unordered-line-sorted"
expect = "pass"
request = "Points 1 1, 3 9, 2 4"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 2, 3], [1, 4, 9])
'''

[[case]]
id = "hist-all-values"
expect = "pass"
request = "Histogram of 1, 2, 2, 3, 9"
program = '''
import matplotlib.pyplot as plt
plt.hist([1, 2, 2, 3, 9], bins=3)
'''

[[case]]
id = "whole-pie"
expect = "pass"
request = "Pie of a 0.1, b 0.2 and c 0.3"
program = '''
import matplotlib.pyplot as plt
plt.pie([0.1, 0.2, 0.3], labels=["a", "b", "c"])
'''

[[case]]
id = "area-from-zero"
expect = "pass"
request = "Fill 6, 8, 7 at 1, 2, 3"
program = '''
import matplotlib.pyplot as plt
plt.fill_between([1, 2, 3], [6, 8, 7])
plt.ylim(0, 10)
'''

[[case]]
id = "legend-names-both"
expect = "pass"
request = "Plot 1, 4, 9 and 2, 3, 5"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 4, 9], label="first")
plt.plot([2, 3, 5], label="second")
plt.legend()
'''

[[case]]
id = "bar-widths-one-width"
expect = "pass"
request = "Plot 3, 5, 4 for a, b, c"
program = '''
import matplotlib.pyplot as plt
plt.bar(["a", "b", "c"], [3, 5, 4], width=0.5)
'''
