# --- R268: a mark's own clip hides part of it -----------------------------------------------------

[[case]]
id = "cr-clip-box-line"
expect = "point_clipped"
site = 3
program = '''
import matplotlib.pyplot as plt
import matplotlib.transforms as mtransforms
line, = plt.plot([1, 2], [3, 4])
line.set_clip_box(mtransforms.TransformedBbox(mtransforms.Bbox([[0, 0], [1.5, 5]]), plt.gca().transData))
'''

[[case]]
id = "cr-clip-box-scatter"
expect = "point_clipped"
site = 3
program = '''
import matplotlib.pyplot as plt
import matplotlib.transforms as mtransforms
dots = plt.scatter([1, 2], [3, 4])
dots.set_clip_box(mtransforms.TransformedBbox(mtransforms.Bbox([[0, 0], [1.5, 5]]), plt.gca().transData))
'''

[[case]]
id = "cr-clip-path-circle"
expect = "point_clipped"
site = 2
program = '''
import matplotlib.pyplot as plt
line, = plt.plot([1, 2], [3, 4])
line.set_clip_path(plt.Circle((1, 3), 0.2, transform=plt.gca().transData))
'''

[[case]]
id = "cr-clip-off"
expect = "pass"
rule = "point_clipped"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 2], [3, 4], clip_on=False)
'''

