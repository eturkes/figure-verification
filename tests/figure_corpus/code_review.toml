# --- R275: a series takes one name across every legend --------------------------------------------

[[case]]
id = "cr-axes-and-figure-legend-rename"
expect = "legend_mismatch"
program = '''
import matplotlib.pyplot as plt
line, = plt.plot([1, 2])
plt.legend([line], ['first'])
plt.gcf().legend([line], ['second'])
'''

[[case]]
id = "cr-two-figure-legends-rename"
expect = "legend_mismatch"
program = '''
import matplotlib.pyplot as plt
line, = plt.plot([1, 2])
plt.gcf().legend([line], ['first'])
plt.gcf().legend([line], ['second'])
'''

[[case]]
id = "cr-axes-and-figure-legend-same-name"
expect = "pass"
rule = "legend_mismatch"
program = '''
import matplotlib.pyplot as plt
line, = plt.plot([1, 2])
plt.legend([line], ['first'])
plt.gcf().legend([line], ['first'])
'''
