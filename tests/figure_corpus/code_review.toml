# --- R311: a colorbar's own axes rules run in the axes stage --------------------------------------

[[case]]
id = "cr-colorbar-inverted"
expect = "axis_inverted"
site = 4
program = '''
import matplotlib.pyplot as plt
dots = plt.scatter([1, 2], [3, 4], c=[5, 6])
bar = plt.colorbar(dots)
bar.ax.invert_yaxis()
'''

[[case]]
id = "cr-colorbar-ticks-after-parts"
expect = "artist_not_judged"
site = 4
program = '''
import matplotlib.pyplot as plt
from matplotlib.patches import Circle
dots = plt.scatter([1, 2], [3, 4], c=[5, 6])
plt.gca().add_patch(Circle((1, 3), 0.1))
bar = plt.colorbar(dots)
bar.set_ticks([5, 6], labels=['50', '60'])
'''

[[case]]
id = "cr-colorbar-formatter-site"
expect = "tick_label_mismatch"
site = 4
program = '''
import matplotlib.pyplot as plt
dots = plt.scatter([1, 2], [3, 4], c=[5, 6])
bar = plt.colorbar(dots)
bar.ax.yaxis.set_major_formatter(lambda value, position: str(value * 10))
'''
