# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# M19 rule corpus, axes + marks: per rule, programs that must block with that rule's reason and
# honest twins that must pass. Format = `integrity.toml`'s.

# --- axes -----------------------------------------------------------------------------------------

[[case]]
id = "line-in-axes-coordinates"
expect = "mark_not_in_data"
site = 2
request = "Plot 0 and 1"
program = '''
import matplotlib.pyplot as plt
plt.plot([0, 1], [0, 1], transform=plt.gca().transAxes)
'''

