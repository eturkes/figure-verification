# Q75: seaborn adds each `hue` legend handle to the axes as an ink-free proxy (a zero-size
# Rectangle, a Line2D holding no point); the legend names a mark through it by colour.

[[case]]
id = "seaborn-bar-hue"
expect = "pass"
rule = "artist_not_judged"
csv = "sales.csv"
request = "Bar chart of revenue by month and region"
program = '''
import pandas as pd
import seaborn as sns
import matplotlib.pyplot as plt
df = pd.read_csv("{data}/sales.csv")
sns.barplot(data=df, x="month", y="revenue", hue="region", errorbar=None)
plt.show()
'''

