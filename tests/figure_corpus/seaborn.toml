csv = "sales.csv"
request = "Line chart of revenue by month and region"
program = '''
import pandas as pd
import seaborn as sns
import matplotlib.pyplot as plt
df = pd.read_csv("{data}/sales.csv")
ax = sns.lineplot(data=df, x="month", y="revenue", hue="region", errorbar=None)
handles, labels = ax.get_legend_handles_labels()
ax.legend(handles, labels[::-1])
plt.show()
'''

[[case]]
id = "inked-legend-proxy"
expect = "artist_not_judged"
site = 4
request = "Plot a 1, b 2"
program = '''
import matplotlib.pyplot as plt
from matplotlib.patches import Rectangle
ax = plt.gca()
handle = Rectangle((0, 0), 1, 1, color="C0", label="Bars")
ax.bar(["a", "b"], [1, 2])
ax.add_artist(handle)
ax.legend(handles=[handle])
'''
