# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Q45 rule corpus, computed values (`.agent/archive/contracts/q45.md`): per admitted computation
# (`computed` = its name; `typed-` = over the request's numbers) an honest twin that passes and a
# wrong-value program that blocks `value_not_found`. Format = `integrity.toml`'s; `shop.csv` sits
# beside this file.

# --- one CSV series --------------------------------------------------------------------------------

[[case]]
id = "cumsum-honest"
computed = "cumsum"
expect = "pass"
rule = "value_not_found"
csv = "sales.csv"
request = "Running total of revenue by month"
program = '''
import pandas as pd
import matplotlib.pyplot as plt
monthly = pd.read_csv("{data}/sales.csv").groupby("month")["revenue"].sum()
plt.plot(monthly.index, monthly.cumsum(), marker="o")
'''

[[case]]
id = "cumsum-wrong"
computed = "cumsum"
expect = "value_not_found"
site = 4
csv = "sales.csv"
request = "Running total of revenue by month"
program = '''
import pandas as pd
import matplotlib.pyplot as plt
monthly = pd.read_csv("{data}/sales.csv").groupby("month")["revenue"].sum()
