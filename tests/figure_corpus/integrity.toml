# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# M19 rule corpus, integrity half: per rule, programs that must block with that rule's reason and
# honest twins that must pass (`.claude/rules/figure.md`). `{data}` = the directory holding
# `data/*.csv` (the repo on the host, /mnt/uploads in the sandbox); `csv` = the attached file;
# `request` = the user's message. `expect` = "pass" or the blocking reason; `site` = the program
# line the failing row marks (absent = no line).

# --- figure ---------------------------------------------------------------------------------------

[[case]]
id = "syntax-error"
expect = "program_syntax_error"
site = 2
request = "Plot 1, 4, 9"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 4, 9]
'''

[[case]]
id = "runtime-error"
expect = "program_error"
site = 3
request = "Plot 1, 4, 9"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 4, 9])
plt.title(missing_name)
'''

[[case]]
id = "runtime-error-twin"
expect = "pass"
rule = "program_error"
request = "Plot 1, 4, 9"
program = '''
import matplotlib.pyplot as plt
plt.plot([1, 4, 9])
plt.title("Squares")
'''

[[case]]
id = "other-plotting-library"
expect = "module_not_available"
site = 1
request = "Plot 1, 4, 9"
program = '''
import plotly.express as px
px.line(y=[1, 4, 9]).show()
'''

