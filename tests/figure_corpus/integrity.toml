[[case]]
id = "twin-axes"
expect = "axes_twin"
site = 6
csv = "sales.csv"
request = "Revenue and orders by month"
program = '''
import pandas as pd
import matplotlib.pyplot as plt
df = pd.read_csv("{data}/sales.csv").groupby("month").sum(numeric_only=True)
ax = plt.gca()
ax.plot(df.index, df["revenue"])
ax.twinx().plot(df.index, df["orders"], color="red")
'''

[[case]]
id = "twin-axes-twin"
expect = "pass"
rule = "axes_twin"
csv = "sales.csv"
request = "Revenue and orders by month"
program = '''
import pandas as pd
import matplotlib.pyplot as plt
df = pd.read_csv("{data}/sales.csv").groupby("month").sum(numeric_only=True)
fig, (top, bottom) = plt.subplots(2, 1, sharex=True)
top.plot(df.index, df["revenue"])
top.set_ylabel("revenue")
bottom.plot(df.index, df["orders"])
bottom.set_ylabel("orders")
'''

