# --- honest twins of the parts rules -------------------------------------------------------------

[[case]]
id = "judged-families"
expect = "pass"
rule = "artist_not_judged"
csv = "sales.csv"
request = "Revenue by region: bars, a line, points, a reference line at 30000 and value labels"
program = '''
import pandas as pd
import matplotlib.pyplot as plt
totals = pd.read_csv("{data}/sales.csv").groupby("region")["revenue"].sum()
bars = plt.bar(totals.index, totals.values, label="revenue")
plt.plot(totals.index, totals.values, color="black", label="line")
plt.scatter(totals.index, totals.values, color="red", label="points")
plt.axhline(30000, color="gray", linestyle="--")
plt.bar_label(bars)
plt.text(0, 1000, "note")
plt.legend()
'''

