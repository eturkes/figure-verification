# --- the shipped banner programs ------------------------------------------------------------------

[[case]]
id = "sentinel-simple"
expect = "pass"
rule = "value_not_found"
csv = "sales.csv"
request = "Chart the total revenue of each region using bars."
program = '''
import pandas as pd
import matplotlib.pyplot as plt

# Read the CSV file
df = pd.read_csv('{data}/sales.csv')

# Group by 'region' and calculate the sum of 'revenue'
grouped_revenue = df.groupby('region')['revenue'].sum()

# Plot the grouped revenue
plt.figure(figsize=(10, 6))
grouped_revenue.plot(kind='bar')
plt.title('Total Revenue by Region')
plt.xlabel('Region')
plt.ylabel('Revenue')
plt.xticks(rotation=45)
plt.show()
'''

[[case]]
id = "ja-sales-simple"
expect = "pass"
rule = "value_not_found"
csv = "sales.csv"
request = "地域ごとの総売上を棒グラフにしてください。"
program = '''
import pandas as pd
import matplotlib.pyplot as plt

# Load the CSV file into a DataFrame
df = pd.read_csv('{data}/sales.csv')

# Group by 'region' and calculate the sum of 'revenue'
grouped_sum = df.groupby('region')['revenue'].sum()

# Plot the grouped sum
plt.figure(figsize=(10, 6))
grouped_sum.plot(kind='bar', color='skyblue')
plt.title('Total Revenue by Region')
plt.xlabel('Region')
plt.ylabel('Revenue')
plt.xticks(rotation=45)
plt.grid(True)
plt.show()
'''
