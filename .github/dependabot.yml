#
# `uv audit` + `pnpm audit` read the committed locks at gate time; Dependabot moves the locks.
# The two are deliberately independent advisory paths, so neither is a single point of
# failure for supply-chain findings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*", "hypothesis", "detect-secrets", "zizmor"]

  # The proposer runtime is a SEPARATE py3.15 CUDA project with its own lock; the gate
  # venv never resolves it, so it needs its own update stream.
  - package-ecosystem: "uv"
    directory: "/model_backend/runtime"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The demo's Open WebUI is a third py3.11 project with its own lock (M21.2); its overrides pin
  # the fixing release of every advisory the upstream pins carry.
  - package-ecosystem: "uv"
    directory: "/webui/runtime"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The suite's CPython 3.11 environment (the image's line) has its own lock, read by the audit stage.
  - package-ecosystem: "uv"
    directory: "/tools/py311"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # The Node measurement harness (puppeteer-core; dev-only, never served) has its own pnpm lock,
  # which the audit stage reads.
  - package-ecosystem: "npm"
    directory: "/.agent/measurements"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
