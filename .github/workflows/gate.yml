# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# CI runs the SAME command a human and an agent run: tools/gate.sh, fanned out one job per stage
# (`CLAUDE.md` `CI gate`). Calling any tool directly here would let CI and the local gate drift into
# two different claims.
name: gate

on:
  push:
    # `ci/<unit>` = an agent's gate run on a commit before it lands (`.claude/rules/ops.md`).
    branches: [main, "ci/**"]
  pull_request:
  # Advisory databases move under a frozen lockfile, so a clean audit decays with time
  # rather than with commits. A weekly run is what surfaces that.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every stage reports, as in one local run: a failure never cancels its siblings.
      fail-fast: false
      matrix:
        stage: [format, lint, types, tests, tests311, audit, secrets, workflows, spec, shell]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate needs no credentials; leaving them in .git/config would expose
          # them to every later step (zizmor: artipacked).
          persist-credentials: false
          # Three baseline tests read a historical commit through `git show` and
          # `git worktree add`. The default depth-1 checkout has no such object, so
          # they fail in CI alone and the gate stops being one claim.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # The audit stage also reads the Node measurement harness's lock through `pnpm audit`. The
      # version comes from that harness's `packageManager` pin; pnpm 12 runs without Node.js.
      - name: Install pnpm
        if: matrix.stage == 'audit'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .agent/measurements/package.json

      - name: Sync the locked environment
        run: uv sync --locked

      # Two predicates of each suite run the paste-in under Open WebUI's own loader; without this
      # interpreter they skip, and CI would claim less than a bootstrapped local run.
      - name: Sync the demo Open WebUI
        if: startsWith(matrix.stage, 'tests')
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv-webui
        run: uv sync --locked --project webui/runtime --quiet

      - name: Run the gate stage
        env:
          STAGE: ${{ matrix.stage }}
        run: bash tools/gate.sh "$STAGE"

  # One result for the whole fan-out: green only when every stage job is.
  gate:
    name: gate
    needs: stage
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every stage
        env:
          RESULT: ${{ needs.stage.result }}
        run: test "$RESULT" = success
