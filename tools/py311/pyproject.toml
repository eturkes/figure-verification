# The suite on the official Open WebUI image's interpreter line (CPython 3.11; the root project is
# 3.14-only). Not a package: the suite imports `verifier` from `src` through PYTHONPATH. Pins follow
# the root dev group where it pins exactly (the bundle's + the image's releases); the rest resolve
# for 3.11 here, since some of the root lock's (contourpy 1.4.0) need 3.12.
[project]
name = "suite-py311"
version = "0"
requires-python = "==3.11.*"
dependencies = [
    "msgspec>=0.22,<1",
    "litestar>=2.25,<3",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6.110",
    "numpy==2.4.3",
    "pyyaml>=6",
    "pydantic==2.13.4",
    "matplotlib==3.10.8",
    "pandas==3.0.2",
    "seaborn==0.13.2",
    "fonttools>=4.67",
    "markdown-it-py>=4",
    "pytest-xdist>=3.8",
]

[tool.uv]
package = false
