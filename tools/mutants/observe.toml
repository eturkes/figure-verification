anchor = '''    return _outward(min(values), max(values))'''
mutant = '''    return min(values), max(values)'''

[[mutant]]
id = "o5-non-singleton-transcendental"
predicate = "a transcendental fed an uncertain interval withholds instead of evaluating one endpoint"
kills = "tests/test_paste_in_observe_formula.py::test_o5_ambiguous_libm_argument_withholds_even_at_host_value[np.sin(np.cos(x))]"
anchor = '''    if low != high:
        return None'''
