# Mutation catalogue for the formula-arm projection. Run: `uv run --locked python tools/mutate.py
# tools/mutants/project.toml`. Each mutant neuters ONE predicate's CONDITION and names the ONE test
# that must go red under it.
#
# Two mutants are deliberately ABSENT because they are EQUIVALENT, not because nothing kills them:
#
# - `type(num_node.value) is int` -> `isinstance(...)`. `bool` subclasses `int` and `True == 1`,
#   which is below `min_grid_samples` = 2, so `num=True` refuses `grid_not_representable` under
#   both spellings. The two diverge only once the minimum drops to 1 or below. Same shape as
#   `admit.py`'s literal-tuple mutant, which is equivalent for the mirror-image reason.
# - Naming the grid variable. `Var` lives in `spec.py`, a different module; P3's bound-vs-inline
#   equality is what pins namelessness.
#
# `p4-unbound-name` mutates the guard's ACTION rather than deleting it, for the same reason:
# deleting it drops `None` into `_expr`, which falls through every isinstance branch to the closed
# tail and refuses with the IDENTICAL code. The guard earns its place by keeping that tail
# unreachable -- which is what its `pragma: no cover` asserts -- so the mutant that distinguishes
# is the one where an unresolvable name silently BECOMES the grid variable.

module = "src/verifier/pysrc/project.py"
tests = ["tests/test_pysrc_project.py", "tests/test_pysrc_integrity.py"]

