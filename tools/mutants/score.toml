# Mutation catalogue for the held-out acceptance SCORER (contract .agent/contracts/m10u9.md, S1-S8).
# Run: `uv run --locked python tools/mutate.py tools/mutants/score.toml`. Each mutant neuters ONE
# conjunct of the scorer's contract and names the ONE test that must go red under it.

module = "capture/score.py"
tests = [
  "tests/test_python_capture_score.py",
  "tests/test_python_capture_score_differential.py",
]

[[mutant]]
# `w1_width.py`'s shape: absent content becomes an empty program the verifier refuses, so a dead
# backend would earn complicated-BLOCKED credit.
id = "s1-transport-scored-through-the-verifier"
predicate = "a transport row never reaches the verifier and never counts as refused"
kills = "tests/test_python_capture_score.py::test_s1_three_outcomes_and_no_verifier_call_on_transport[0]"
anchor = '''
    if record.http_status != _OK or record.content is None:
        return _scored(record, "transport_error", None, None)
    target = DatasetTarget(path=_UPLOADS + record.dataset_name, content=data[record.dataset_name])
    verdict = verify_python_source(defence(record.content)[1], declared_target=target)'''
mutant = '''
    target = DatasetTarget(path=_UPLOADS + record.dataset_name, content=data[record.dataset_name])
    verdict = verify_python_source(defence(record.content or "")[1], declared_target=target)'''

[[mutant]]
id = "s3-numerator-counts-rows-outside-the-set"
predicate = "only rows of the run's own corpus set enter a category numerator"
kills = "tests/test_python_capture_score.py::test_s3_denominators_exclude_sentinels_and_keep_transport_rows[verified-simple]"
anchor = '''                if row.prompt_id in own
                and own[row.prompt_id].category == category'''
mutant = '''                if row.category == category'''

[[mutant]]
id = "s3-complicated-transport-counted-blocked"
predicate = "a complicated transport row is not blocked"
kills = "tests/test_python_capture_score.py::test_s3_denominators_exclude_sentinels_and_keep_transport_rows[transport_error-complicated]"
anchor = '''        blocked=credited("complicated", "refused"),'''
mutant = '''        blocked=credited("complicated", "refused") + credited("complicated", "transport_error"),'''

[[mutant]]
id = "s4-bar-boundary-exclusive"
predicate = "exactly 70% meets the bar: 10*count >= 7*total, never >"
kills = "tests/test_python_capture_score.py::test_s4_acceptance_boundaries[14-14-True]"
anchor = '''_BAR_DENOMINATOR * count >= _BAR_NUMERATOR * total'''
mutant = '''_BAR_DENOMINATOR * count > _BAR_NUMERATOR * total'''

[[mutant]]
id = "s4-complicated-sentinel-unchecked"
predicate = "sentinel-complicated must be refused for acceptance"
kills = "tests/test_python_capture_score.py::test_s4_each_conjunct_can_withhold[sentinel-complicated-verified-True-0]"
anchor = '''("verified" if prompt.category == "simple" else "refused")'''
mutant = '''("verified" if prompt.category == "simple" else sentinels.get(prompt_id))'''

[[mutant]]
id = "s4-completeness-dropped"
predicate = "a missing row alone withholds acceptance"
kills = "tests/test_python_capture_score.py::test_s4_each_conjunct_can_withhold[heldout-simple-20-None-False-0]"
anchor = '''            acceptance_met=complete'''
mutant = '''            acceptance_met=True'''

[[mutant]]
id = "s4-transport-conjunct-dropped"
predicate = "one transport row alone withholds acceptance"
kills = "tests/test_python_capture_score.py::test_s4_each_conjunct_can_withhold[heldout-simple-20-transport_error-True-1]"
anchor = '''            and transport == 0'''
mutant = '''            and True'''

[[mutant]]
id = "s8-guard-admits-a-second-run"
predicate = "EXACTLY-ONCE: a second held-out run fails the guard"
kills = "tests/test_python_capture_score.py::test_s8_exactly_once_guard[two-1]"
anchor = '''
    if len(held) != 1:
        names = ", ".join(path.name for path in held) or "none"
        return [f"expected exactly one held-out run under {root}, found {len(held)}: {names}"]
    (directory,) = held'''
mutant = '''
    if not held:
        names = ", ".join(path.name for path in held) or "none"
        return [f"expected exactly one held-out run under {root}, found {len(held)}: {names}"]
    directory = held[0]'''
