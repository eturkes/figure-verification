# Q43 V1 + V2: the admin Valve refuses unreadable text on save, and its aliases reach the verdict
# and the receipt the outlet reads.
module = "webui/paste_in/tool.py"
tests = ["tests/test_paste_in_aliases.py"]

[[mutant]]
id = "q43-valve-unvalidated"
predicate = "V1: saving unreadable alias text fails (OWUI runs Valves(**form))"
kills = "tests/test_paste_in_aliases.py::test_q43_v1_a_malformed_line_fails_the_save"
