# Pre-scan (M18.1): the tokenizer escape a refusal now closes, and where each pre-scan refusal
# points. The caps themselves stay pinned by tests/test_pysrc_prescan.py.
module = "src/verifier/pysrc/prescan.py"
tests = ["tests/test_pysrc_prescan.py", "tests/test_pysrc_position.py"]

[[mutant]]
id = "m18-tokenizer-decode-error-escapes"
predicate = "a tokenizer UnicodeDecodeError refuses source_not_tokenizable instead of escaping the verifier"
kills = "tests/test_pysrc_position.py::test_p2_tokenizer_mixed_cr_nonascii_is_total"
anchor = '''    except UnicodeDecodeError as exc:
        _refuse("source_not_tokenizable", exc)'''
mutant = '''    except KeyError as exc:
        _refuse("source_not_tokenizable", exc)'''

[[mutant]]
id = "m18-nul-at-start"
predicate = "a NUL refusal points at the first NUL"
kills = "tests/test_pysrc_position.py::test_p3_prescan_places[nul-first]"
anchor = '''        _refuse("source_has_nul", at=(located.char(text.index("\x00")),))'''
mutant = '''        _refuse("source_has_nul", at=(located.char(0),))'''

[[mutant]]
id = "m18-line-offset-drops-terminators"
predicate = "each splitlines piece starts after the previous piece's line terminator"
kills = "tests/test_pysrc_position.py::test_p3_prescan_places[line-cap-nel]"
anchor = '''        start += len(ended)'''
mutant = '''        start += len(line)'''

[[mutant]]
id = "m18-nesting-unlocated"
predicate = "a nesting refusal points at the opener past the cap"
kills = "tests/test_pysrc_position.py::test_p3_prescan_places[nesting]"
anchor = '''                _refuse("nesting_too_deep", at=_token_span(token, source))'''
mutant = '''                _refuse("nesting_too_deep")'''

[[mutant]]
id = "m18-indent-unlocated"
predicate = "an indentation refusal points at the indent past the cap"
kills = "tests/test_pysrc_position.py::test_p3_prescan_places[indent-tabs]"
anchor = '''                _refuse("indent_too_deep", at=_token_span(token, source))'''
mutant = '''                _refuse("indent_too_deep")'''

[[mutant]]
id = "m18-undecodable-column-absolute"
predicate = "an undecodable byte's column counts from its own line's start"
kills = "tests/test_pysrc_position.py::test_p3_prescan_undecodable_bytes"
anchor = '''        column = exc.start - (breaks[-1].end() if breaks else 0)'''
mutant = '''        column = exc.start'''
