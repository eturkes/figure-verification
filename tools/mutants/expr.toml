# Mutation catalogue for the legacy formula expression engine's runtime closure (Q4).
# Each mutant neuters one condition; the named test must change outcome. Run with tools/mutate.py.
module = "src/verifier/expr.py"
tests = ["tests/test_review_m9_expr_closure.py", "tests/test_review_m9_eval_contract.py", "tests/test_expr.py"]

[[mutant]]
id = "number-negative-admitted"
predicate = "a negative Number literal refuses"
kills = "tests/test_review_m9_expr_closure.py::test_number_refuses_direct_negative_literal"
anchor = '''        if self.value < 0:
            msg = "number literal must be non-negative; negation is a Neg node"'''
mutant = '''        if False:
            msg = "number literal must be non-negative; negation is a Neg node"'''

[[mutant]]
id = "binary-op-unguarded"
predicate = "Binary refuses an undeclared operator on construction"
kills = "tests/test_review_m9_expr_closure.py::test_binary_refuses_dunder_shaped_operator_on_direct_construction"
anchor = '''        if self.op not in _BINARY_OPS:'''
mutant = '''        if False:'''

[[mutant]]
id = "apply-binary-falls-to-div"
predicate = "an unmatched operator refuses instead of dividing"
kills = "tests/test_review_m9_eval_contract.py::test_binary_operator_dispatch_refuses_dunder_near_miss"
anchor = '''    if name != "div":
        msg = f"binary operator is not admitted: {name[:16]!r}"'''
mutant = '''    if False:
        msg = f"binary operator is not admitted: {name[:16]!r}"'''

[[mutant]]
id = "interpret-catch-all-binary"
predicate = "the interpreter refuses a non-node instead of treating it as Binary"
kills = "tests/test_review_m9_eval_contract.py::test_evaluator_refuses_structural_binary_near_miss"
anchor = '''    if type(node) is Binary:
        return _interpret_binary(node, binding, limits, budget)
    raise _undeclared_node(node)'''
mutant = '''    return _interpret_binary(node, binding, limits, budget)  # type: ignore[arg-type]'''

[[mutant]]
id = "interpret-number-isinstance"
predicate = "the interpreter dispatches Number on the exact type"
kills = "tests/test_review_m9_eval_contract.py::test_evaluator_refuses_undeclared_node_subclass"
anchor = '''    if type(node) is Number:
        _charge_expression(budget, "number")'''
mutant = '''    if isinstance(node, Number):
        _charge_expression(budget, "number")'''

