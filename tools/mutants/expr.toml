[[mutant]]
id = "printer-catch-all-binary"
predicate = "the printer refuses a non-node instead of printing it as Binary"
kills = "tests/test_review_m9_expr_closure.py::test_printer_refuses_structural_near_miss_instead_of_aliasing_binary"
anchor = '''    if type(node) is Binary:
