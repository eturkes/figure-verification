# Mutation catalogue for the ADMISSION allowlist. Run: `uv run --locked python tools/mutate.py
# tools/mutants/admit.toml`. Each mutant neuters ONE predicate's CONDITION and names the ONE test
# that must go red under it.
#
# Scope today = M13.8's accessor route ALONE. The 13 mutants that credited `admit.py` at M13.2 were
# driven by a gitignored script, and porting them here -- together with the M13.4/M13.6 admission
# predicates that never earned mutation credit at all -- is a queued `.agent/deferred.md` row.
# A claim credited in `project.toml` can sit unmutated here: `project.toml` covers only what
# PROJECTION decides, and every refusal this route lands is decided before projection runs.
#
# `p2-kind-map-opened` is deliberately ABSENT as a mutant over the MAP: opening
# `ADMITTED_ACCESSOR_KINDS` to a third key is a data edit, not a predicate neuter, and the exact-set
# assertion on that literal is what fails. `p2-missing-kind-defaults` below is the predicate form --
# absent `kind` becoming a line plot is pandas' own default and the fault the closed map exists for.

module = "src/verifier/pysrc/admit.py"
tests = [
  "tests/test_pysrc_accessor.py",
  "tests/test_pysrc_admit.py",
  "tests/test_pysrc_aggregate.py",
]

