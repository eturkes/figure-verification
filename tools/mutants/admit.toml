# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Mutation catalogue for the ADMISSION allowlist. Run: `uv run --locked python tools/mutate.py
# tools/mutants/admit.toml`. Each mutant neuters ONE predicate's CONDITION and names the ONE test
# that must go red under it.
#
# Scope = accessor route + base allowlist + column/aggregation/presentation admission.
# Projection-only predicates stay in `project.toml`; admission refusals earn their own mutants.
# Literal membership/arity entries define the boundary too: removing a presentation entry, changing
# the tuple arity, or re-mapping a kind changes the predicate just as neutering a branch does.
# M2 is equal on the default literal set; its kill narrows that set to price the exact-type rule.
# The reduction func Attribute conjunct is a source-domain postcondition of `_groupby_root`: every
# Call traversed to reach the root has an Attribute func. Its removal alone opens no shape.

# Accessor kind-map expansion is pinned by its exact-literal assertion. Mutation covers the
# missing-kind predicate + line-to-bar entry rather than repeating every unlisted map key.
# Absent `kind` defaults to a line in pandas; the closed map must refuse that implicit target.

module = "src/verifier/pysrc/admit.py"
