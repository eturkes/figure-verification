# Mutation catalogue for the grouped reduction engine. Run: `uv run --locked python
# tools/mutate.py tools/mutants/aggregate.toml`. One mutant per R-predicate, each naming the ONE
# test that must go red under it.
#
# R1 is what prices this unit. Every choice in `aggregate.py` is fixed by MEASUREMENT against
# pandas rather than by what is arithmetically nicest, and a plausible implementation gets exactly
# this one wrong: naive left-to-right summation differs from pandas on 2,761 of 4,000
# admitted-profile CSV groups and `math.fsum` on 1,483, while Kahan matches on 0 of 16,062. So the
# naive mutant and the `fsum` mutant BOTH ship, against the same test, because "not naive" and
# "not more precise than pandas" are two different claims and a suite can pin one without the other.
#
# Three predicates are deliberately UNMUTATED, each for a stated reason:
#
# - R5 (an int64 sum cannot overflow) and R6 (NaN never reaches a reduction) are ABSENCE claims:
#   the profile refuses the input ahead of this module, so there is no branch here to neuter. Each
#   witness takes the shape its OWN absence earns, and the two shapes differ: R6 arms a
#   call-counting bomb on `_numeric_value` and proves the reduction never runs, while R5 computes
#   the worst-case magnitude from C10's cell range times `max_table_rows` and asserts it below
#   2**63 -- an arithmetic bound with no bomb, reddened by a `max_table_rows` widening.
# - `_reduce_int`'s `float(sum(values))` is equivalent under the profile. C10 bounds each cell to
#   int32 and `max_table_rows` bounds the count, so every admitted integer sum stays under 2**48
#   and float64 carries it exactly; a mutant summing in float64 instead differs only on inputs the
#   profile already refuses.
#
# `b4-dtype-reads-the-parsed-value` kills by RAISING rather than by failing an assertion, and that
# is inherent rather than sloppy: the integer path reads `int(text)` directly, so any mutant that
# types a decimal-bearing column as int64 reaches that call with `'2147483648.0'`. The verdict
# still differs, which is the credit the driver grades, and `b4-no-integer-dtype` carries the same
# predicate's clean value-kill beside it.

module = "src/verifier/pysrc/aggregate.py"
tests = ["tests/test_pysrc_aggregate.py"]

[[mutant]]
id = "r1-naive-sum"
predicate = "a float64 group sum is ORDERED Kahan compensation, not naive left-to-right addition"
kills = "tests/test_pysrc_aggregate.py::test_r1_float_sum_is_kahan_not_naive_or_fsum"
anchor = '''
    total = 0.0
    compensation = 0.0
    for value in values:
        adjusted = value - compensation
        running = total + adjusted
        compensation = (running - total) - adjusted
        total = running
    return total'''
mutant = '''
    total = 0.0
    for value in values:
        total = total + value
    return total'''

[[mutant]]
id = "r1-fsum"
predicate = "the sum matches pandas, which means it is NOT the more precise engine either"
kills = "tests/test_pysrc_aggregate.py::test_r1_float_sum_is_kahan_not_naive_or_fsum"
anchor = '''
    total = 0.0
    compensation = 0.0
    for value in values:
        adjusted = value - compensation
        running = total + adjusted
        compensation = (running - total) - adjusted
        total = running
    return total'''
mutant = '''
    import math  # noqa: PLC0415 - a spelling the module refuses on purpose

    return math.fsum(values)'''

[[mutant]]
id = "r2-running-mean"
predicate = "a float64 mean is the Kahan sum THEN the divide, never a running mean"
kills = "tests/test_pysrc_aggregate.py::test_r2_float_mean_is_kahan_sum_over_count"
anchor = '''
            return _kahan_sum(values) / len(values)'''
mutant = '''
            mean = 0.0
            for count, value in enumerate(values, start=1):
                mean += (value - mean) / count
            return mean'''

