# Mutation catalogue for the user-request formula grammar. Each mutant neuters one condition;
# the named test must change outcome. Run with tools/mutate.py and a private UV_PROJECT_ENVIRONMENT.
module = "src/verifier/pysrc/request.py"
tests = ["tests/test_pysrc_request.py", "tests/test_pysrc_request_internal.py", "tests/test_pysrc_project.py"]

[[mutant]]
id = "r2-nfkc-omitted"
predicate = "full-width request text is folded before carrier and expression extraction"
kills = "tests/test_pysrc_request.py::test_r2_nfkc_is_applied_before_carrier_and_expression_rules"
anchor = '''    normalized = unicodedata.normalize("NFKC", text)'''
mutant = '''    normalized = text'''

