# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Open WebUI's bundled CJK font (M17.1): an unavailable font degrades to None off the event loop;
# owned files read to one byte past max_csv_bytes (M21.1 F4); the persistence setting read
# fail-closed (M21.1 F5).
module = "webui/paste_in/owui_files.py"
tests = ["tests/test_paste_in_owui_files.py"]

[[mutant]]
id = "of-file-error-uncaught"
predicate = "a missing or unreadable font file degrades to None"
kills = "tests/test_paste_in_owui_files.py::test_f4_font_source_swallows_each_exception_family[file]"
anchor = '''    except Exception:
        return None'''
mutant = '''    except ImportError:
        return None'''

[[mutant]]
id = "of-cancellation-swallowed"
predicate = "a cancelled read propagates instead of degrading"
kills = "tests/test_paste_in_owui_files.py::test_f4_font_source_propagates_cancellation"
anchor = '''    except Exception:
        return None'''
mutant = '''    except BaseException:
        return None'''

[[mutant]]
id = "of-read-on-loop"
predicate = "the 5.7 MB read runs in a worker thread, never on the event loop"
kills = "tests/test_paste_in_owui_files.py::test_f4_font_source_reads_owui_fonts_dir_off_the_loop_and_never_raises"
anchor = '''        return await asyncio.to_thread(Path(FONTS_DIR, CJK_FONT_NAME).read_bytes)'''
mutant = '''        return Path(FONTS_DIR, CJK_FONT_NAME).read_bytes()'''

[[mutant]]
id = "of-wrong-font-file"
predicate = "the static Noto Sans JP file OWUI ships for its own PDF export"
kills = "tests/test_paste_in_owui_files.py::test_f4_font_source_reads_owui_fonts_dir_off_the_loop_and_never_raises"
anchor = '''CJK_FONT_NAME = "NotoSansJP-Regular.ttf"'''
mutant = '''CJK_FONT_NAME = "NotoSansJP-Variable.ttf"'''

[[mutant]]
id = "of-fault-logged-unguarded"
predicate = "the degrade path runs nothing that can raise, so a failing log sink never costs the verdict"
kills = "tests/test_paste_in_owui_files.py::test_f4_font_source_survives_a_raising_log_sink"
anchor = '''    except Exception:
        return None'''
mutant = '''    except Exception:
        logging.getLogger(__name__).debug("Bundled CJK font unavailable")
        return None'''

[[mutant]]
id = "m21-read-whole"
predicate = "an owned file is read to one byte past max_csv_bytes, never whole (M21.1 F4)"
kills = "tests/test_paste_in_owui_files.py::test_m21_owned_files_read_at_most_one_byte_past_the_csv_limit"
anchor = '''        return handle.read(_READ_BYTES)'''
mutant = '''        return handle.read()'''

[[mutant]]
id = "m21-read-to-the-limit"
predicate = "the read keeps the one byte that lets the judge refuse an oversize file (M21.1 F4)"
kills = "tests/test_paste_in_owui_files.py::test_m21_owned_files_read_at_most_one_byte_past_the_csv_limit"
anchor = '''_READ_BYTES = DEFAULT_LIMITS.max_csv_bytes + 1'''
mutant = '''_READ_BYTES = DEFAULT_LIMITS.max_csv_bytes'''

[[mutant]]
id = "m21-persistence-truthy"
predicate = "an exact False alone counts as the origin-null sandbox (M21.1 F5)"
kills = "tests/test_paste_in_outlet.py::test_m21_a_sandbox_with_the_site_s_origin_refuses_before_files_and_rpc"
anchor = '''    return ENABLE_PYODIDE_FILE_PERSISTENCE is False'''
mutant = '''    return not ENABLE_PYODIDE_FILE_PERSISTENCE'''

[[mutant]]
id = "m21-persistence-unread-isolated"
predicate = "a persistence setting that cannot be read counts as not isolated (M21.1 F5)"
kills = "tests/test_paste_in_outlet.py::test_m21_a_sandbox_with_the_site_s_origin_refuses_before_files_and_rpc"
anchor = '''    except Exception:
        return False
    return ENABLE_PYODIDE_FILE_PERSISTENCE is False'''
mutant = '''    except Exception:
        return True
    return ENABLE_PYODIDE_FILE_PERSISTENCE is False'''
