# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
# Mutation catalogue for the CSV profile the judge reads the user's file with. Run: `uv run --locked
# python tools/mutate.py tools/mutants/csvread.toml`. One mutant per predicate, each naming the ONE
# test that must go red under it; the tests read through the consumer, `sources.read_table`.
#
# EQUIVALENT, so unlisted: dropping the NA-spelling sweep in `_check_selected_text`. Every NA
# spelling either fails stdlib `float` (a text column) or fails the fixed-point profile (`NaN`,
# `nan`), so the column offers no numbers either way.

module = "src/verifier/pysrc/csvread.py"
tests = ["tests/test_pysrc_csv.py"]

[[mutant]]
id = "c6-bom-gate-dropped"
predicate = "a file opening with a UTF-8 BOM is refused whole (pandas and stdlib read the header apart)"
kills = "tests/test_pysrc_csv.py::test_c6_strict_structural_profile"
anchor = '''    if content.startswith(_UTF8_BOM) or b"\x00" in content:'''
mutant = '''    if b"\x00" in content:'''

[[mutant]]
id = "c6-ragged-row-accepted"
predicate = "a row whose width differs from the header's is refused whole"
kills = "tests/test_pysrc_csv.py::test_c6_strict_structural_profile"
anchor = '''            if len(row) != len(header_row):'''
mutant = '''            if False:'''

[[mutant]]
id = "c6-header-only-accepted"
predicate = "a file with no data row is refused whole"
kills = "tests/test_pysrc_csv.py::test_c6_strict_structural_profile"
anchor = '''    if not rows:'''
mutant = '''    if False:'''

[[mutant]]
id = "c10-fixed-point-shape-dropped"
predicate = "a number outside the fixed-point shape (exponent, sign, padding, hex) offers no number"
kills = "tests/test_pysrc_csv.py::test_c10_profile_boundaries_leave_no_numbers"
anchor = '''        _NUMBER.fullmatch(text) is None
        or'''
mutant = '''        False
        or'''

[[mutant]]
id = "c10-int32-max-exclusive"
predicate = "an integer column admits 2**31 - 1 itself: the int32 clause is inclusive at the top"
kills = "tests/test_pysrc_csv.py::test_c10_an_integer_column_admits_both_int32_endpoints"
anchor = '''_INT32_MAX = 2**31 - 1'''
mutant = '''_INT32_MAX = 2**31 - 2'''

[[mutant]]
id = "c10-int32-min-exclusive"
predicate = "an integer column admits -2**31 itself: the int32 clause is inclusive at the bottom"
kills = "tests/test_pysrc_csv.py::test_c10_an_integer_column_admits_both_int32_endpoints"
anchor = '''_INT32_MIN = -(2**31)'''
mutant = '''_INT32_MIN = -(2**31) + 1'''

[[mutant]]
id = "q12-integer-column-range-dropped"
predicate = "an integer column keeps C10's int32 cell clause (Pyodide's integer bar raises outside it)"
kills = "tests/test_pysrc_csv.py::test_q12_a_float64_column_admits_magnitudes_past_int32"
anchor = '''        or (integer_column and not _INT32_MIN <= value <= _INT32_MAX)'''
mutant = '''        or False'''


[[mutant]]
id = "q12-float-column-bound-to-int32"
predicate = "a float64 column is not held to int32: its cells draw through the float path"
kills = "tests/test_pysrc_csv.py::test_q12_a_float64_column_admits_magnitudes_past_int32"
anchor = '''        or (integer_column and not _INT32_MIN <= value <= _INT32_MAX)'''
mutant = '''        or not _INT32_MIN <= value <= _INT32_MAX'''


[[mutant]]
id = "q12-column-dtype-ignored"
predicate = "the column's inferred dtype, not each token alone, picks the range clause"
kills = "tests/test_pysrc_csv.py::test_q12_a_float64_column_admits_magnitudes_past_int32"
anchor = '''    integer_column = column_dtype(texts) == "int64"'''
mutant = '''    integer_column = all("." not in text for text in texts[:1])'''
