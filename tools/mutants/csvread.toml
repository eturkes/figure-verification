mutant = '''        else (-math.inf, math.inf)'''

# Q8 `header_names`: each whole-file gate and each caught failure leaves an unreadable header
# anchoring nothing, so recomputation's own refusal names the fault. EQUIVALENT, so unlisted:
# dropping `PysrcRefusalError` from the caught set lets `_check_record_endings` raise from the
# header read, and that refusal is the one `read_columns` raises for the same bytes -- every gate
# ahead of it already passed -- so the verdict cannot differ.

