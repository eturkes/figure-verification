# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
#
# The demo's Open WebUI, locked + audited (M21.2). NOT a member of the root uv project: it syncs on
# its own into .venv-webui, and nothing in the gate imports it — the launcher runs its binary.
#
# The interpreter line is the official image's (CPython 3.11), so the demo runs the paste-in pair
# under the Python production runs it under.

[project]
name = "webui-runtime"
version = "0.1.0"
description = "Pinned Open WebUI for the figure-verification demo."
requires-python = "==3.11.*"
dependencies = ["open-webui==0.11.3"]

[tool.uv]
# open-webui pins its dependencies exactly; each override lifts one past the advisories its pin
# carries to the lowest fixing release, capped at that minor series so the stack moves as little
# as the fix needs. The gate's audit stage names the residuals no release fixes yet.
# fonttools = the image's own version: the filter cuts the Japanese font with it.
override-dependencies = [
    "accelerate>=1.15.0,<1.16",
    "aiohttp>=3.14.3,<3.15",
    "anthropic>=0.87.0,<0.88",
    "cryptography>=50.0.0,<51",
    "fonttools==4.64.0",
    "langchain>=1.3.9,<1.4",
    "langgraph-sdk>=0.4.4,<0.5",
    "mcp>=1.28.1,<1.29",
    "nltk>=3.10.3,<4",
    "pillow>=12.3.0,<13",
    "pyarrow>=23.0.1,<24",
    "pyjwt[crypto]>=2.15.0,<3",
    "pymdown-extensions>=11.0.1,<11.1",
    "pypdf>=6.19.0,<6.21",
    "restrictedpython>=8.4,<9",
    "sentence-transformers>=5.6.0,<5.7",
    "transformers>=5.10.0,<5.11",
]
