# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception
[project]
name = "verifier"
version = "0.2.0"
description = "Figure verifier for Open WebUI: a trusted reader + judge decide whether a model-drawn matplotlib figure may appear."
# Pinned to the 3.14.x line for reproducibility: msgspec ships per-interpreter compiled
# wheels and stdlib behavior can drift across minors, so a wider floor would admit an
# untested interpreter.
requires-python = ">=3.14,<3.15"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]
authors = [{ name = "Emir Turkes", email = "eturkes@bu.edu" }]
# The verifier core (src/verifier) is stdlib-only. msgspec + litestar + uvicorn + httpx serve the
# demo harness (model stub, model backend wire types, Open WebUI provisioning client).
dependencies = [
    "msgspec>=0.22,<1",
    "litestar>=2.25,<3",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6.110",
    # test-only: `binary64-libm-v1` claims agreement with what the sandbox executes, and the
    # sandbox executes numpy. A numeric test that cannot compare against numpy pins nothing.
    # Pinned EXACTLY to the version the Open WebUI 0.12.3 bundle (Pyodide 314.0.3) carries, because
    # the measured 1-ulp band is a statement about that pair. A bump that changes a libm result must
    # turn the numeric tests red rather than pass quietly under a band measured on different code.
    "numpy==2.4.3",
    # Gate scanners, resolved from this lock so the local gate and CI cannot drift apart.
    # detect-secrets runs against a SLIM baseline (no line numbers) -- a full baseline
    # demands a rewrite on any line drift, which breaks gate idempotence on a clean tree.
    "detect-secrets>=1.5",
    # zizmor audits the workflows themselves: SHA pinning, token scope, Dependabot cooldown.
    "zizmor>=1.10",
    # test-only: tests/test_gate.py parses the committed workflow + Dependabot YAML.
    "pyyaml>=6",
    "types-pyyaml>=6",
    # test-only (Q43): the tool's admin `Valves` is a pydantic model, which Open WebUI builds on
    # save and on load. Pinned EXACTLY to the version Open WebUI 0.12.3 ships, so the tests run the
    # validation the admin's instance runs; the paste-in imports it from the OWUI image.
    "pydantic==2.13.4",
    # test-only (M19): the figure reader runs inside Open WebUI's Pyodide sandbox, whose 0.12.3
    # bundle (Pyodide 314.0.3) ships matplotlib 3.10.8 + pandas 3.0.2: the host runs the same
    # releases, and every corpus claim made on this host is re-run on the bundle by its Pyodide leg.
    "matplotlib==3.10.8",
    "pandas==3.0.2",
    # test-only (Q73): the wrapper loads the bundle's seaborn 0.13.2 for a program that names it, so
    # the corpus's seaborn cases run the same release here.
    "seaborn==0.13.2",
    # test-only: the oracle of the filter's stdlib font cut (Q74) + the test fonts' generator
    # (tools/subset_test_font.py); the Open WebUI 0.12.3 image holds none, so no image version binds
    # it. matplotlib needs `fonttools>=4.22`.
    "fonttools>=4.67",
    # test-only (M21.1 F1): an independent CommonMark parser grades the interpretation's code spans,
    # since Open WebUI renders the reply as markdown with raw HTML.
    "markdown-it-py>=4",
    # Mutation credit (`CLAUDE.md` `Engineering`): the stack's mutation tool, default operators,
    # driven by tools/mutation_credit.py over the files one test executes (research pass, queue
    # row Q53).
    "poodle>=1.3.4",
    # Gate speed (Q61): the `tests` + `tests311` stages run the suite across every CPU; pytest-cov
    # combines the workers' data, so the 100% branch floor still reads the whole run.
    "pytest-xdist>=3.8",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# --- lint / format -----------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
# Generated (`tools/render_gallery.py`): each code block quotes a tested corpus program byte for byte,
# so `ruff format`'s Markdown code-block pass must leave it as the case runs.
extend-exclude = ["docs/gallery.md", "docs/gallery.ja.md"]

# The shipped pair runs inside Open WebUI's own interpreter: the official image is CPython 3.11
# (`open-webui` admits >=3.11,<3.13), and a 3.12 construct there fails the import (M21.2 F11).
[tool.ruff.per-file-target-version]
"src/verifier/**" = "py311"
"webui/paste_in/**" = "py311"
"paste-in/**" = "py311"
"webui/demo-paste-in/**" = "py311"
"nucllei_skill/**" = "py311"
"llens/**" = "py311"
# The suite also runs on 3.11 (gate stage `tests311`, the image's line): tests, every repo module
# they import and every script they run through `sys.executable` (tools/generate_paste_in.py) spell
# 3.11 forms too; image_leg.py runs inside the image. ruff's py314 formatter writes PEP 758
# `except A, B:`, a SyntaxError before 3.14.
"tests/**" = "py311"
"model_backend/**" = "py311"
"webui/**" = "py311"
"tools/**" = "py311"
".agent/measurements/image_leg.py" = "py311"
".agent/measurements/nucllei_live.py" = "py311"

[tool.ruff.lint]
# Explicit select (never "ALL"): new rule categories never auto-enable on upgrade.
# The exact rule set is still pinned by uv.lock, so run the gate with `uv run --locked`.
# S (bandit), T20 (no print), DTZ (tz-aware datetime) are load-bearing for a security/determinism core.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "T20", "DTZ",
    "C4", "SIM", "PTH", "RET", "RUF", "PL", "TRY", "EM",
    "FURB", "PERF", "A", "ARG", "PIE", "ICN", "TID", "FBT",
]
ignore = [
    "COM812", # trailing commas — owned by the formatter
    "ISC001", # implicit string concat — owned by the formatter
]

[tool.ruff.lint.per-file-ignores]
# asserts + bare magic values are idiomatic in tests; TID251 lets tests import numpy.
"tests/**" = ["S101", "PLR2004", "TID251"]
# Measurement harnesses: frozen records of how a published number was obtained, never imported by
# anything. Each of these four rules is inapplicable BY CONSTRUCTION here, not merely inconvenient.
# numpy/pandas ARE the subject under measurement (TID251); stdout IS the result (T201); the stratum
# bounds and sample counts are literal by design and reading them from a constant would hide the
# corpus shape (PLR2004); and the corpus invariants are asserted where they are built (S101). These
# files sit outside mypy's `files` list on purpose -- typing frozen numpy record scripts under
# --strict would buy a strictness hole or a pandas-stubs dependency for no gate value.
".agent/measurements/**" = ["S101", "PLR2004", "T201", "TID251"]
# The stdlib font cut (Q74) reads + writes binary tables whose byte values ARE the OpenType + CFF
# specs' (format numbers, operator codes, record sizes); naming each would only restate the spec.
"webui/paste_in/sfnt.py" = ["PLR2004"]

[tool.ruff.lint.isort]
# model_backend (hardware-gated local model server) and webui (Open WebUI integration harness)
# are repo-root packages, not under src/ — declare them first-party so their imports sort with
# verifier's.
known-first-party = ["verifier", "model_backend", "webui", "nucllei_skill"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# numpy is a dev/test-only dep: ban it outside tests/ so a stray core import fails the gate.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy".msg = "test-only (numeric differential); the core is stdlib-only and the paste-in has no deps"

# --- types -------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
# The four repo-root packages above type-check under --strict but ship separately
# (coverage-excluded, absent from the wheel).
files = ["src", "tests", "tools", "model_backend", "webui", "nucllei_skill"]
# tests/ on the path so mypy resolves `import oracle` (the dev-only DuckDB oracle).
mypy_path = ["src", "tests"]
warn_unreachable = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

# The proposer runtime (torch + Transformers) resolves from the SEPARATE py3.15 project
# at model_backend/runtime/, never into this py3.14 gate venv, and its stubs are absent or partial.
# model_backend is their only importer; the engine isolates the resulting Any behind typed
# boundaries. accelerate and tokenizers stay OUT: they are transitive runtime deps that no module
# imports, and an override for an unimported module states a dependency the code does not have.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

# open_webui resolves inside the target image and in the SEPARATE py3.11 .venv-webui, never into
# this py3.14 gate venv, and it ships no stubs. webui/paste_in/owui_files.py is its only importer
# and is the single module allowed to reach it (the paste-in's whole non-stdlib surface); it
# projects the dynamic file/storage API into one frozen UploadedFile per attachment.
[[tool.mypy.overrides]]
module = ["open_webui", "open_webui.*"]
ignore_missing_imports = true

# nucllei (the llens server, Q82) resolves inside its own image alone and ships no stubs.
# nucllei_skill/host.py is its only importer and the single module allowed to reach it.
[[tool.mypy.overrides]]
module = ["nucllei", "nucllei.*"]
ignore_missing_imports = true

# --- tests / coverage --------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib --cov --cov-report=term-missing"
testpaths = ["tests"]
# tests/ so test support modules resolve; the repo root so the uninstalled `webui` +
# `model_backend` packages resolve.
pythonpath = ["tests", "."]
xfail_strict = true
# A Litestar deprecation names what its next major removes; the suite builds both apps, so it
# fails here rather than at that upgrade.
filterwarnings = ["error::litestar.exceptions.LitestarDeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["verifier"]

[tool.coverage.report]
show_missing = true
include = ["*/src/verifier/*"]
fail_under = 100
exclude_also = [
    # No "raise NotImplementedError" / "..." here: in a trusted core an unimplemented
    # stub must show as uncovered and fail the 100% gate, not be quietly excused.
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
